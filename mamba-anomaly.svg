<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="mambaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9F0F7"/>
      <stop offset="60%" stop-color="#F6B8CE"/>
      <stop offset="100%" stop-color="#BFE3D3"/>
    </linearGradient>
    <linearGradient id="scanBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F9A82" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#4F9A82" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#mambaBg)"/>

  <!-- soft blobs for consistency with site's decorative style -->
  <circle cx="90" cy="80" r="70" fill="#8FD2E8" opacity="0.28"/>
  <circle cx="730" cy="430" r="90" fill="#E8799E" opacity="0.18"/>

  <!-- selective-scan band -->
  <rect x="60" y="190" width="680" height="120" rx="16" fill="url(#scanBand)"/>
  <text x="400" y="175" text-anchor="middle" font-family="Georgia, 'Fraunces', serif" font-style="italic" font-size="22" fill="#332C2A" opacity="0.6">selective state-space scan</text>

  <!-- incoming sensor waveform (time series input) -->
  <polyline points="60,250 110,230 160,268 210,220 260,255 310,238 360,262 400,250"
            fill="none" stroke="#332C2A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- outgoing reconstructed / scored waveform -->
  <polyline points="400,250 440,236 490,258 540,224 590,248 640,232 690,250 740,242"
            fill="none" stroke="#4F9A82" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- state nodes along the scan -->
  <g fill="#332C2A">
    <circle cx="110" cy="230" r="6" opacity="0.55"/>
    <circle cx="210" cy="220" r="6" opacity="0.55"/>
    <circle cx="310" cy="238" r="6" opacity="0.55"/>
  </g>
  <g fill="#4F9A82">
    <circle cx="490" cy="258" r="6"/>
    <circle cx="590" cy="248" r="6"/>
    <circle cx="690" cy="250" r="6"/>
  </g>

  <!-- flagged anomaly point -->
  <circle cx="540" cy="224" r="11" fill="none" stroke="#E8799E" stroke-width="3"/>
  <circle cx="540" cy="224" r="5" fill="#E8799E"/>
  <text x="540" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="15" fill="#E8799E">anomaly</text>

  <!-- arrow through the scan -->
  <path d="M 400 310 L 400 340" stroke="#332C2A" stroke-width="2" opacity="0.35" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#332C2A" opacity="0.35"/>
    </marker>
  </defs>

  <text x="400" y="370" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#332C2A" opacity="0.7">reconstruction error → anomaly score</text>
</svg>
